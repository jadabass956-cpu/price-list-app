name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Backup our files then scaffold android
        run: |
          mv lib /tmp/lib_backup
          mv pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --org com.example --project-name price_list_app --platforms=android .
          rm -rf lib
          mv /tmp/lib_backup lib
          mv /tmp/pubspec_backup.yaml pubspec.yaml

      - name: Force Kotlin 2.0.10 and compileSdk 35
        run: |
          # رفع Kotlin في settings.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "2.0.10"/' android/settings.gradle
          # رفع compileSdk و targetSdk في build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/' android/app/build.gradle
          # إصلاح aapt2 لـ SDK 35
          echo "android.aapt2Version=8.6.1-11315950" >> android/gradle.properties

      - run: flutter pub get
      - run: flutter clean
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
